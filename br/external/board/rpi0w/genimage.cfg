# SD card layout, A/B root slots (U-Boot, see boot.cmd):
#   0-4 MiB  MBR, U-Boot environment at 1 MiB and 2 MiB
#   p1  boot      firmware, U-Boot, boot.scr, DT and overlays (not
#                 written in operation)
#   p2  rootfs.A  squashfs, kernel in /boot
#   p3  rootfs.B  squashfs, kernel in /boot
#   p4  data      ext4, mounted on /data (config, credentials, state),
#                 initial content from data/ (rootpath)

image boot.vfat {
	vfat {
		label = "boot"
		files = {
			"rpi-firmware/bootcode.bin",
			"rpi-firmware/start.elf",
			"rpi-firmware/fixup.dat",
			"rpi-firmware/config.txt",
			"rpi-firmware/overlays",
			"bcm2708-rpi-zero-w.dtb",
			"u-boot.bin",
			"boot.scr",
		}
	}
	size = 64M
}

image data.ext4 {
	ext4 {
		label = "data"
		use-mke2fs = true
	}
	size = 256M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
		align = 4M
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs-a {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 256M
	}

	partition rootfs-b {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 256M
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
