# SD card layout, A/B slots for updates (RPi firmware autoboot/tryboot):
#   p1  autoboot  bootcode.bin, autoboot.txt (selects p2 or p3)
#   p2  boot.A    firmware, kernel, config, root=/dev/mmcblk0p5
#   p3  boot.B    firmware, kernel, config, root=/dev/mmcblk0p6
#   p5  rootfs.A  squashfs
#   p6  rootfs.B  squashfs
#   p7  data      ext4, mounted on /data (config, credentials, state)

image autoboot.vfat {
	vfat {
		label = "autoboot"
		files = {
			"rpi-firmware/bootcode.bin",
			"autoboot.txt",
		}
	}
	size = 8M
}

image boot-a.vfat {
	vfat {
		label = "boot-a"
		files = {
			"rpi-firmware/start_cd.elf",
			"rpi-firmware/fixup_cd.dat",
			"rpi-firmware/config.txt",
			"rpi-firmware/overlays",
			"bcm2708-rpi-zero-w.dtb",
			"zImage",
		}
		file cmdline.txt { image = "cmdline-a.txt" }
	}
	size = 64M
}

image boot-b.vfat {
	vfat {
		label = "boot-b"
		files = {
			"rpi-firmware/start_cd.elf",
			"rpi-firmware/fixup_cd.dat",
			"rpi-firmware/config.txt",
			"rpi-firmware/overlays",
			"bcm2708-rpi-zero-w.dtb",
			"zImage",
		}
		file cmdline.txt { image = "cmdline-b.txt" }
	}
	size = 64M
}

image data.ext4 {
	ext4 {
		label = "data"
		use-mke2fs = true
	}
	size = 256M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
		align = 4M
	}

	partition autoboot {
		partition-type = 0xC
		bootable = "true"
		image = "autoboot.vfat"
	}

	partition boot-a {
		partition-type = 0xC
		image = "boot-a.vfat"
	}

	partition boot-b {
		partition-type = 0xC
		image = "boot-b.vfat"
	}

	partition rootfs-a {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 256M
	}

	partition rootfs-b {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 256M
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
