# Config and state on the data partition; start after the initial NTP sync
# (no RTC, counters and logs need the right time).
[Unit]
Wants=time-sync.target
After=time-sync.target
RequiresMountsFor=/data

[Service]
ExecStart=
ExecStart=/usr/bin/uvrgw /data/uvrgw.conf
StateDirectory=
Environment=STATE_DIRECTORY=/data/uvrgw
