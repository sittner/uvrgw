# Config and state on the data partition.  No wait for NTP: uvrgw only
# sends CAN timestamps and takes logger snapshots while the clock is
# synchronised, the counters use the monotonic clock.
[Unit]
RequiresMountsFor=/data

[Service]
ExecStart=
ExecStart=/usr/bin/uvrgw /data/uvrgw.conf
StateDirectory=
Environment=STATE_DIRECTORY=/data/uvrgw
